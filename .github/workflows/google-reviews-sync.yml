# Refreshes the homepage reviews (data/google-reviews.json) from Google every week.
# Needs repo secrets: GBP_CLIENT_ID, GBP_CLIENT_SECRET, GBP_REFRESH_TOKEN (optional: GBP_ACCOUNT_ID, GBP_LOCATION_ID)
name: Sync Google reviews to homepage

on:
  schedule:
    - cron: "0 5 * * 1" # Mondays, 10:30 AM IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: google-reviews-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch reviews
        env:
          GBP_CLIENT_ID: ${{ secrets.GBP_CLIENT_ID }}
          GBP_CLIENT_SECRET: ${{ secrets.GBP_CLIENT_SECRET }}
          GBP_REFRESH_TOKEN: ${{ secrets.GBP_REFRESH_TOKEN }}
          GBP_ACCOUNT_ID: ${{ secrets.GBP_ACCOUNT_ID }}
          GBP_LOCATION_ID: ${{ secrets.GBP_LOCATION_ID }}
        run: node --no-warnings scripts/sync-reviews.mjs

      - name: Commit if changed (Vercel redeploys on push)
        run: |
          if git diff --quiet data/google-reviews.json; then
            echo "Nothing to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/google-reviews.json
            git commit -m "Update Google reviews on homepage"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
